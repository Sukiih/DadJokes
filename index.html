<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Dad jokes </title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container text-center">
        <h1>Dad Jokes para no morir por la nostalgia</h1>
        <img class="dino-img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT2OdqYG0Id2W0ftpCsu7D6UUdJcTVESXlsLA&s" alt="Rex chistes malos">
        <button id="generateJoke" class="btn btn-danger mt-4">Generar chiste</button>
        <div id="jokeDisplay" class="joke-container mt-4" style="display: none;" ></div>

        <!--Agrego un formulario para que los usuarios puedan ingresar sus propios chistes-->
        <div class="mt-5 mb-3">
            <h3>¿Tienes un chiste que compartir? Agregalo!</h3>
            <form id="addJokeForm" class="mt-3">
                <input type="text" id="jokeQuestion" class="form-control" placeholder="Escribe la pregunta del chiste" />
                <input type="text" id="jokeAnswer" class="form-control mt-2" placeholder="Escribe la respuesta para el chiste" />
                <button id="addJoke" class="btn btn-success mt-4">Agregar chiste</button>
            </form>
        </div>
    </div>

 
    <script src="assets/js/script.js"></script>
</body>
</html>
